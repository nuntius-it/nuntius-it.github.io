# appId invariato dal vecchio "Nuntius Sender" per non rompere l'auto-update.
appId: io.github.nuntius-it.sender
productName: Nuntius
directories:
  output: dist
files:
  - main.js
  - preload.cjs
  - config.js
  - db/**
  - renderer-app/**
  - package.json
# Niente ricompilazione dei moduli nativi: better-sqlite3 porta i prebuild
# N-API nel pacchetto npm, validi sia per Node sia per Electron.
npmRebuild: false
asarUnpack:
  - "**/node_modules/whatsapp-web.js/**"
  - "**/node_modules/puppeteer*/**"
  - "**/node_modules/better-sqlite3/**"
extraResources:
  - from: chrome-cache
    to: chrome-cache
afterSign: sign-adhoc.cjs
mac:
  target:
    - dmg
    - zip
  # Il suffisso arch distingue il dmg per Mac Intel (x64) da quello Apple Silicon (arm64)
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.productivity
win:
  target:
    - nsis
nsis:
  oneClick: true
  language: "1040"
publish:
  provider: github
  owner: nuntius-it
  repo: nuntius-it.github.io
