appId: io.github.nuntius-it.sender
productName: Nuntius Sender
directories:
  output: dist
files:
  - main.js
  - preload.cjs
  - config.js
  - renderer/**
  - package.json
asarUnpack:
  - "**/node_modules/whatsapp-web.js/**"
  - "**/node_modules/puppeteer*/**"
extraResources:
  - from: chrome-cache
    to: chrome-cache
mac:
  target:
    - dmg
    - zip
  # Il suffisso arch distingue il dmg per Mac Intel (x64) da quello Apple Silicon (arm64)
  artifactName: "${productName}-${version}-${arch}.${ext}"
  category: public.app-category.productivity
win:
  target:
    - nsis
nsis:
  oneClick: true
  language: "1040"
publish:
  provider: github
  owner: nuntius-it
  repo: nuntius-it.github.io
