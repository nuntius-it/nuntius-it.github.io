name: Release Nuntius

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # I runner Intel (macos-13) non esistono più: la build per Mac Intel è
        # cross-compilata sul runner arm64, con il Chrome Intel ("mac" per
        # @puppeteer/browsers) scaricato a parte.
        include:
          - os: macos-latest
            build_args: --mac --arm64
          - os: macos-latest
            build_args: --mac --x64
            chrome_platform: mac
          - os: windows-latest
            build_args: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sender/package-lock.json
            webapp/package-lock.json
      # Chrome di puppeteer va scaricato dentro il progetto, così electron-builder
      # lo include nell'installer (extraResources): sui computer delle parrocchie
      # non esiste la cache ~/.cache/puppeteer. Per la build cross-arch il download
      # automatico (che seguirebbe l'arch del runner) è disattivato e sostituito
      # dal passo esplicito con @puppeteer/browsers.
      - run: npm ci
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/sender/chrome-cache
          PUPPETEER_SKIP_CHROME_HEADLESS_SHELL_DOWNLOAD: "true"
          PUPPETEER_SKIP_DOWNLOAD: ${{ matrix.chrome_platform && 'true' || '' }}
      - if: matrix.chrome_platform
        run: npx @puppeteer/browsers install chrome@stable --platform ${{ matrix.chrome_platform }} --path ${{ github.workspace }}/sender/chrome-cache
      # La UI dell'app è la webapp: dipendenze, test e build Vite, poi lo
      # script "ui" copia webapp/dist in sender/renderer-app (shell bash anche
      # su Windows per rm/cp).
      - run: npm ci
        working-directory: webapp
      - run: npm test
        working-directory: webapp
      - run: npm run ui
        shell: bash
      - run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
