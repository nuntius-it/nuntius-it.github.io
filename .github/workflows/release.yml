name: Release Nuntius

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # I runner Intel (macos-13) non esistono più: la build per Mac Intel è
        # cross-compilata sul runner arm64, con il Chrome Intel ("mac" per
        # @puppeteer/browsers) scaricato a parte.
        include:
          - os: macos-latest
            build_args: --mac --arm64
            chrome_platform: mac_arm
          - os: macos-latest
            build_args: --mac --x64
            chrome_platform: mac
          - os: windows-latest
            build_args: --win
            chrome_platform: win64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            sender/package-lock.json
            webapp/package-lock.json
      # Niente script di install: better-sqlite3 usa i prebuild N-API inclusi
      # nel pacchetto (la compilazione implicita con node-gyp è fragile sui
      # runner: Python senza distutils, Visual Studio 2026 non riconosciuto).
      # Il binario di Electron, che di norma arriva dal suo postinstall, viene
      # scaricato a parte con npm rebuild.
      - run: npm ci --ignore-scripts
      - run: npm rebuild electron
      # Chrome di puppeteer va scaricato dentro il progetto, così electron-builder
      # lo include nell'installer (extraResources): sui computer delle parrocchie
      # non esiste la cache ~/.cache/puppeteer. Con --ignore-scripts il download
      # automatico non parte mai: si usa sempre il passo esplicito, con la
      # piattaforma dalla matrice (mac_arm / mac / win64).
      - run: npx @puppeteer/browsers install chrome@stable --platform ${{ matrix.chrome_platform }} --path ${{ github.workspace }}/sender/chrome-cache
      # La UI dell'app è la webapp: dipendenze, test e build Vite, poi lo
      # script "ui" copia webapp/dist in sender/renderer-app (shell bash anche
      # su Windows per rm/cp).
      - run: npm ci
        working-directory: webapp
      - run: npm test
        working-directory: webapp
      - run: npm run ui
        shell: bash
      - run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
